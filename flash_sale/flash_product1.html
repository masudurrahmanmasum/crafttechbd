<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product Details | Craft Tech BD</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --purple: #6848f5;
        --purple-dark: #5637dc;
        --light: #f7f6ff;
        --text: #252525;
        --muted: #777;
        --orange: #ff9800;
        --green: #18a663;
        --border: #eceaf4;
      }

      body {
        background: #f8f8fc;
        color: var(--text);
        font-family: "Hind Siliguri", sans-serif;
      }

      /* HEADER */
      .header {
        height: 74px;
        background: #fff;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 6%;
        position: sticky;
        top: 0;
        z-index: 50;
      }

      .logo {
        font-size: 25px;
        font-weight: 800;
      }
      .logo img {
        width: 12rem;
        display: block;
      }

      .back {
        border: 0;
        background: var(--light);
        color: var(--purple);
        padding: 10px 17px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
      }

      /* BREADCRUMB */
      .breadcrumb {
        max-width: 1180px;
        margin: 25px auto 0;
        padding: 0 20px;
        color: #999;
        font-size: 14px;
      }

      .breadcrumb span {
        color: var(--purple);
      }

      /* MAIN PRODUCT */
      .container {
        max-width: 1180px;
        margin: 18px auto 60px;
        padding: 0 20px;
      }

      .product {
        background: #fff;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 18px 55px rgba(55, 40, 120, 0.1);
        display: grid;
        grid-template-columns: 52% 48%;
      }

      /* IMAGE */
      .product-image {
        min-height: 650px;
        background: #eeeef3;
        position: relative;
        padding: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 85%;
      }

      .product-image img {
        width: 100%;
        height: 600px;
        object-fit: cover;
        border-radius: 17px;
        display: block;
      }

      .sale {
        position: absolute;
        top: 42px;
        left: 42px;
        background: #ff6262;
        color: #fff;
        font-weight: 700;
        padding: 7px 17px;
        border-radius: 9px;
        z-index: 2;
      }

      .favorite {
        position: absolute;
        top: 40px;
        right: 40px;
        width: 45px;
        height: 45px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        font-size: 22px;
        cursor: pointer;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      /* DETAILS */
      .details {
        padding: 48px 45px;
      }

      .category {
        color: var(--purple);
        font-family: Poppins, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.6px;
        margin-bottom: 12px;
      }

      .title {
        font-family: Poppins, sans-serif;
        font-size: 32px;
        line-height: 1.3;
        margin-bottom: 13px;
      }

      .rating {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
      }

      .stars {
        color: var(--orange);
        letter-spacing: 2px;
        font-size: 17px;
      }

      .reviews {
        color: #888;
        font-size: 14px;
      }

      .price {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 24px;
      }

      .current-price {
        font-family: Poppins, sans-serif;
        font-size: 32px;
        color: var(--purple);
        font-weight: 800;
      }

      .old-price {
        color: #aaa;
        text-decoration: line-through;
        font-size: 17px;
      }

      .description {
        color: #666;
        line-height: 1.9;
        font-size: 16px;
        border-top: 1px solid var(--border);
        padding-top: 20px;
      }

      /* PRODUCT OPTIONS */
      .option-title {
        font-weight: 700;
        margin: 22px 0 9px;
      }

      .sizes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .size {
        min-width: 45px;
        height: 40px;
        padding: 0 13px;
        border: 1px solid #ddd;
        background: #fff;
        border-radius: 8px;
        cursor: pointer;
      }

      .size.active {
        color: #fff;
        background: var(--purple);
        border-color: var(--purple);
      }

      .colors {
        display: flex;
        gap: 10px;
      }

      .color {
        width: 29px;
        height: 29px;
        border-radius: 50%;
        border: 3px solid #fff;
        outline: 1px solid #ddd;
        cursor: pointer;
      }

      .color.active {
        outline: 2px solid var(--purple);
      }

      /* QUANTITY */
      .buy-row {
        display: flex;
        gap: 12px;
        margin-top: 25px;
      }

      .quantity {
        height: 53px;
        display: flex;
        align-items: center;
        border: 1px solid #ddd;
        border-radius: 11px;
        overflow: hidden;
      }

      .quantity button {
        width: 40px;
        height: 100%;
        border: 0;
        background: #f6f5fb;
        cursor: pointer;
        font-size: 20px;
      }

      .quantity span {
        width: 42px;
        text-align: center;
        font-weight: 700;
      }

      .order-btn {
        flex: 1;
        height: 53px;
        border: 0;
        border-radius: 11px;
        color: #fff;
        background: var(--purple);
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(104, 72, 245, 0.25);
        transition: 0.25s;
      }

      .order-btn:hover {
        background: var(--purple-dark);
        transform: translateY(-2px);
      }

      .info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      .info-box {
        background: #faf9ff;
        border: 1px solid #efecff;
        border-radius: 10px;
        padding: 11px 13px;
        color: #666;
        font-size: 14px;
      }

      .info-box strong {
        color: #222;
      }

      /* STOCK */
      .stock {
        display: flex;
        justify-content: space-between;
        color: #ff5d5d;
        font-weight: 600;
        margin-top: 25px;
        margin-bottom: 7px;
      }

      .progress {
        height: 8px;
        background: #ededed;
        border-radius: 20px;
        overflow: hidden;
      }

      .progress span {
        display: block;
        height: 100%;
        width: 78%;
        background: linear-gradient(90deg, #6848f5, #9a87ff);
        border-radius: 20px;
      }

      /* DESCRIPTION SECTION */
      .long-description {
        background: #fff;
        margin-top: 24px;
        border-radius: 20px;
        padding: 35px 40px;
        box-shadow: 0 15px 45px rgba(55, 40, 120, 0.07);
      }

      .long-description h2 {
        font-family: Poppins, sans-serif;
        font-size: 23px;
        margin-bottom: 13px;
      }

      .long-description p {
        color: #666;
        line-height: 1.9;
      }

      .long-description ul {
        margin-top: 15px;
        padding-left: 23px;
        color: #666;
        line-height: 2;
      }

      /* MODAL */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(20, 15, 40, 0.68);
        z-index: 100;
        align-items: center;
        justify-content: center;
        padding: 18px;
        backdrop-filter: blur(4px);
      }

      .modal.show {
        display: flex;
      }

      .modal-box {
        width: min(500px, 100%);
        max-height: 92vh;
        overflow: auto;
        background: #fff;
        border-radius: 20px;
        padding: 28px;
        position: relative;
      }

      .close {
        position: absolute;
        right: 15px;
        top: 15px;
        width: 37px;
        height: 37px;
        border: 0;
        border-radius: 50%;
        background: #f1f0f6;
        cursor: pointer;
        font-size: 21px;
      }

      .modal h2 {
        font-family: Poppins, sans-serif;
      }

      .selected {
        color: var(--purple);
        font-weight: 700;
        margin: 5px 0 20px;
      }

      .form-group {
        margin-bottom: 14px;
      }

      .form-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 5px;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 9px;
        padding: 11px 12px;
        outline: none;
      }

      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        border-color: var(--purple);
      }

      .confirm {
        width: 100%;
        border: 0;
        border-radius: 10px;
        background: var(--green);
        color: #fff;
        padding: 14px;
        cursor: pointer;
        font-weight: 700;
        font-size: 16px;
      }

      .success {
        display: none;
        text-align: center;
        padding: 25px 5px;
      }

      .success-icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 14px;
        display: grid;
        place-items: center;
        background: #e7f8ef;
        color: var(--green);
        border-radius: 50%;
        font-size: 32px;
      }

      /* MOBILE */
      @media (max-width: 850px) {
        .product {
          grid-template-columns: 1fr;
        }

        .product-image {
          min-height: auto;
        }

        .product-image img {
          height: 450px;
        }

        .details {
          padding: 32px 25px;
        }
      }

      @media (max-width: 520px) {
        .header {
          padding: 0 18px;
        }

        .logo {
          font-size: 25px;
          font-weight: 800;
        }
        .logo img {
          width: 12rem;
        }

        .product-image {
          padding: 15px;
        }

        .product-image img {
          height: 330px;
        }

        .sale {
          top: 28px;
          left: 28px;
        }

        .favorite {
          top: 25px;
          right: 25px;
        }

        .title {
          font-size: 25px;
        }

        .current-price {
          font-size: 27px;
        }

        .info {
          grid-template-columns: 1fr;
        }

        .buy-row {
          flex-direction: column;
        }

        .quantity {
          width: max-content;
        }

        .order-btn {
          width: 100%;
        }

        .long-description {
          padding: 25px 20px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================
       HEADER
  ========================= -->

    <header class="header">
      <div class="logo">
        <a href="../index.html" class="logo">
          <img src="../image/craft_logo.png" alt="Craft Tech BD" />
        </a>
      </div>

      <button class="back" onclick="history.back()">← ফিরে যান</button>
    </header>

    <!-- =========================
       BREADCRUMB
  ========================= -->

    <div class="breadcrumb">
      Home / Products /

      <span id="breadcrumbProduct"> Loading... </span>
    </div>

    <!-- =========================
       PRODUCT
  ========================= -->

    <main class="container">
      <div id="productContainer">
        <div class="loading">Product loading...</div>
      </div>
    </main>

    <!-- =========================
       ORDER MODAL
  ========================= -->

    <div class="modal" id="modal">
      <div class="modal-box">
        <button class="close" id="close">×</button>

        <div id="formArea">
          <h2>অর্ডার করুন</h2>

          <div class="selected" id="selectedProduct"></div>

          <form id="orderForm">
            <div class="form-group">
              <label> আপনার নাম * </label>

              <input
                type="text"
                id="customerName"
                placeholder="পূর্ণ নাম"
                required
              />
            </div>

            <div class="form-group">
              <label> মোবাইল নম্বর * </label>

              <input
                type="tel"
                id="customerPhone"
                placeholder="01XXXXXXXXX"
                required
              />
            </div>

            <div class="form-group">
              <label> ডেলিভারি ঠিকানা * </label>

              <textarea
                id="customerAddress"
                rows="3"
                placeholder="সম্পূর্ণ ঠিকানা"
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label> Payment Method </label>

              <select id="paymentMethod">
                <option>Cash on Delivery</option>

                <option>bKash</option>

                <option>Nagad</option>
              </select>
            </div>

            <button class="confirm" type="submit">অর্ডার কনফার্ম করুন</button>
          </form>
        </div>

        <!-- SUCCESS -->

        <div class="success" id="success">
          <div class="success-icon">✓</div>

          <h2>অর্ডার সফলভাবে গ্রহণ করা হয়েছে!</h2>

          <p style="color: #777; margin-top: 8px">
            আমাদের প্রতিনিধি খুব শীঘ্রই আপনার সাথে যোগাযোগ করবেন।
          </p>
        </div>
      </div>
    </div>

    <!-- =========================
       JAVASCRIPT
  ========================= -->

    <script>
      "use strict";

      let product = null;
      let quantity = 1;

      const googleScriptURL =
        "https://script.google.com/macros/s/AKfycbx1vJEF_32j92GWe9pamuZVRSvs2bi_m422c9ELrhivrzd391kohAriVlULxvSK26Qt/exec";
      const whatsappNumber = "8801609278822";
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id") || "1";
      const money = (value) => Number(value || 0).toLocaleString("en-BD");
      const safeText = (value, fallback = "") =>
        value == null ? fallback : String(value);

      async function loadProduct() {
        const container = document.getElementById("productContainer");
        try {
          console.log("Loading product...", "Product ID:", productId);
          const response = await fetch("../flash_product.json", {
            cache: "no-store",
          });
          console.log("JSON response status:", response.status);
          if (!response.ok)
            throw new Error(
              `flash_product.json লোড হয়নি (HTTP ${response.status})`,
            );

          const data = await response.json();
          if (!data || !Array.isArray(data.products)) {
            throw new Error('JSON ফাইলে "products" নামে array পাওয়া যায়নি।');
          }

          product = data.products.find(
            (item) => String(item.id) === String(productId),
          );
          if (!product)
            throw new Error(`Product ID "${productId}" পাওয়া যায়নি।`);
          if (product.enabled === false)
            throw new Error("এই প্রোডাক্টটি বর্তমানে বন্ধ আছে।");

          quantity = Math.max(1, Number(product.quantity?.default || 1));
          renderProduct();
          setupProductEvents();
          console.log("Product loaded successfully:", product);
        } catch (error) {
          console.error("PRODUCT LOAD ERROR:", error);
          container.innerHTML = `<div class="error" style="padding:24px;color:#b42318"><h3>প্রোডাক্ট লোড করতে সমস্যা হয়েছে</h3><p>${safeText(error.message, "অজানা সমস্যা")}</p><p>JSON ফাইলের path এবং Product ID পরীক্ষা করুন।</p></div>`;
        }
      }

      function renderProduct() {
        const container = document.getElementById("productContainer");
        const name = safeText(product.name, "Product");
        const category = safeText(product.category, "PRODUCT");
        const currency = safeText(product.price?.currency, "৳");
        // JSON schema is flat: price, oldPrice, discount, rating, reviews, shortDescription, stock, soldPercent.
        const currentPrice =
          Number(
            typeof product.price === "object"
              ? product.price?.current
              : product.price,
          ) || 0;
        const oldPrice =
          Number(
            typeof product.oldPrice === "object"
              ? product.oldPrice?.old
              : product.oldPrice,
          ) || 0;
        const discount =
          Number(product.discount ?? product.sale?.discount ?? 0) || 0;
        const ratingValue =
          Number(
            typeof product.rating === "object"
              ? product.rating?.stars
              : product.rating,
          ) || 0;
        const reviews =
          Number(product.reviews ?? product.rating?.reviews ?? 0) || 0;
        const shortDescription = safeText(
          product.shortDescription || product.description,
          "এই প্রোডাক্টের বিস্তারিত শিগগিরই যোগ করা হবে।",
        );
        const stockCount = Number(
          typeof product.stock === "object"
            ? product.stock?.quantity
            : product.stock,
        );
        const soldPercent = Math.max(
          0,
          Math.min(
            100,
            Number(product.soldPercent ?? product.stock?.percentage ?? 0) || 0,
          ),
        );
        const stockMessage =
          product.stock?.message ||
          (Number.isFinite(stockCount)
            ? stockCount > 0
              ? `স্টকে আছে: ${stockCount} টি`
              : "স্টক শেষ"
            : "স্টক সীমিত");
        const saleEnabled =
          product.enabled !== false &&
          (product.sale?.enabled ?? discount > 0) &&
          discount > 0;
        const saleHTML = saleEnabled
          ? `<div class="sale">-${discount}%</div>`
          : "";
        const clampedRating = Math.max(0, Math.min(5, Math.round(ratingValue)));
        const stars = "★".repeat(clampedRating) + "☆".repeat(5 - clampedRating);

        const infoItems = [
          {
            icon: "🚚",
            title: product.delivery?.title || "ডেলিভারি",
            description:
              product.delivery?.description || "সারা বাংলাদেশে ডেলিভারি সুবিধা",
          },
          {
            icon: "💵",
            title: product.payment?.title || "পেমেন্ট",
            description:
              product.payment?.description || "ক্যাশ অন ডেলিভারি সুবিধা",
          },
          {
            icon: "🔄",
            title: product.return?.title || "রিটার্ন",
            description:
              product.return?.description ||
              "রিটার্ন নীতিমালা জানতে যোগাযোগ করুন",
          },
          {
            icon: "🛡️",
            title: product.quality?.title || "কোয়ালিটি",
            description: product.quality?.description || "মানসম্মত পণ্য",
          },
        ];
        const infoHTML = infoItems
          .map(
            (item) =>
              `<div class="info-box"><strong>${item.icon} ${safeText(item.title)}</strong><br>${safeText(item.description)}</div>`,
          )
          .join("");

        const full = product.fullDescription || {};
        const longDescription = safeText(
          full.description || product.longDescription || shortDescription,
        );
        const features = Array.isArray(full.features)
          ? full.features
          : Array.isArray(product.features)
            ? product.features
            : [];
        const featuresHTML = features
          .map((feature) => `<li>${safeText(feature)}</li>`)
          .join("");
        const oldPriceHTML =
          oldPrice > currentPrice
            ? `<span class="old-price">${currency}${money(oldPrice)}</span>`
            : "";

        container.innerHTML = `
      <section class="product">
        <div class="product-image">
          ${saleHTML}
          <button class="favorite" id="favorite" type="button" aria-label="পছন্দের তালিকায় যোগ করুন">♡</button>
          <img src="${safeText(product.image)}" alt="${name}" onerror="this.onerror=null;this.src='https://placehold.co/700x700?text=Product+Image';">
        </div>
        <div class="details">
          <div class="category">${category}</div>
          <h1 class="title">${name}</h1>
          <div class="rating"><span class="stars">${stars}</span><span class="reviews">${ratingValue ? ratingValue.toFixed(1) : "0.0"} (${reviews} Reviews)</span></div>
          <div class="price"><span class="current-price">${currency}${money(currentPrice)}</span>${oldPriceHTML}</div>
          <p class="description">${shortDescription}</p>
          <div class="buy-row">
            <div class="quantity">
              <button id="minus" type="button" aria-label="পরিমাণ কমান">−</button>
              <span id="quantity">${quantity}</span>
              <button id="plus" type="button" aria-label="পরিমাণ বাড়ান">+</button>
            </div>
            <button class="order-btn" id="orderBtn" type="button">🛒 এখনই অর্ডার করুন</button>
          </div>
          <div class="info">${infoHTML}</div>
          <div class="stock"><span>${safeText(stockMessage)}</span><span>${soldPercent}% বিক্রি</span></div>
          <div class="progress"><span style="width:${soldPercent}%"></span></div>
        </div>
      </section>
      <section class="long-description">
        <h2>${safeText(full.title || "প্রোডাক্টের বিস্তারিত বিবরণ")}</h2>
        <p>${longDescription}</p>
        ${featuresHTML ? `<ul>${featuresHTML}</ul>` : ""}
      </section>`;

        document.getElementById("breadcrumbProduct").textContent = name;
        document.title = `${name} | Craft Tech BD`;
      }

      function setupProductEvents() {
        document.getElementById("plus").addEventListener("click", () => {
          const maximum = Number(product.quantity?.maximum || 10);
          const available =
            typeof product.stock === "number"
              ? product.stock
              : Number(product.stock?.quantity);
          const limit =
            Number.isFinite(available) && available > 0
              ? Math.min(maximum, available)
              : maximum;
          if (quantity < limit) {
            quantity++;
            document.getElementById("quantity").textContent = quantity;
          }
        });
        document.getElementById("minus").addEventListener("click", () => {
          const minimum = Number(product.quantity?.minimum || 1);
          if (quantity > minimum) {
            quantity--;
            document.getElementById("quantity").textContent = quantity;
          }
        });
        document
          .getElementById("favorite")
          .addEventListener("click", function () {
            const active = this.textContent.trim() === "♡";
            this.textContent = active ? "♥" : "♡";
            this.style.color = active ? "#ff4d6d" : "#222";
          });
        document
          .getElementById("orderBtn")
          .addEventListener("click", openModal);
      }

      const modal = document.getElementById("modal");
      function openModal() {
        if (!product) return;
        modal.classList.add("show");
        document.body.style.overflow = "hidden";
        const price =
          Number(
            typeof product.price === "object"
              ? product.price?.current
              : product.price,
          ) || 0;
        document.getElementById("selectedProduct").textContent =
          `${product.name} — ৳${money(price)} × ${quantity} = ৳${money(price * quantity)}`;
      }
      function closeModal() {
        modal.classList.remove("show");
        document.body.style.overflow = "";
      }
      document.getElementById("close").addEventListener("click", closeModal);
      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal();
      });

      document
        .getElementById("orderForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();
          if (!product) return;
          const name = document.getElementById("customerName").value.trim();
          const phone = document.getElementById("customerPhone").value.trim();
          const address = document
            .getElementById("customerAddress")
            .value.trim();
          const payment = document.getElementById("paymentMethod").value;
          const productName = product.name;
          const price =
            Number(
              typeof product.price === "object"
                ? product.price?.current
                : product.price,
            ) || 0;
          const total = price * quantity;
          const formData = new URLSearchParams();
          formData.append("name", name);
          formData.append("phone", phone);
          formData.append("address", address);
          formData.append("payment", payment);
          formData.append("product", productName);
          formData.append("productId", product.id);
          formData.append("quantity", quantity);
          formData.append("price", price);
          formData.append("total", total);

          const submitButton = this.querySelector('[type="submit"]');
          submitButton.disabled = true;
          submitButton.textContent = "অর্ডার পাঠানো হচ্ছে...";
          try {
            // no-cors means the browser cannot verify the Apps Script response; this preserves the existing endpoint workflow.
            await fetch(googleScriptURL, {
              method: "POST",
              body: formData,
              mode: "no-cors",
            });
            const message = `🛒 নতুন অর্ডার\n\n📦 Product: ${productName}\n🆔 Product ID: ${product.id}\n🔢 Quantity: ${quantity}\n💰 Price: ৳${money(price)}\n💵 Total: ৳${money(total)}\n👤 নাম: ${name}\n📱 মোবাইল: ${phone}\n📍 ঠিকানা: ${address}\n💳 Payment Method: ${payment}`;
            window.open(
              `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`,
              "_blank",
            );
            document.getElementById("formArea").style.display = "none";
            document.getElementById("success").style.display = "block";
          } catch (error) {
            console.error("Order Error:", error);
            alert("অর্ডার পাঠাতে সমস্যা হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।");
          } finally {
            submitButton.disabled = false;
            submitButton.textContent = "অর্ডার কনফার্ম করুন";
          }
        });

      loadProduct();
    </script>
  </body>
</html>
